group 'com.kasem.receive_sharing_intent'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.22' // Or a newer version
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group 'com.kasem.receive_sharing_intent'
version '1.6.6'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.kasem.receive_sharing_intent'
    }

    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 19
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    // This dependency provides the io.flutter.* classes
    compileOnly files(getFlutterJarPath())
}

// Function to locate the Flutter jar
def getFlutterJarPath() {
    def properties = new Properties()
    file("local.properties").withInputStream { properties.load(it) }
    def flutterRoot = properties.getProperty("flutter.sdk")
    assert flutterRoot != null, "flutter.sdk not set in local.properties"
    if (flutterRoot == null) {
        throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
    }
    return new File(flutterRoot, 'bin/cache/artifacts/engine/android-arm64-release/flutter.jar')
}
